<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThriftSpot - Discover Finds</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- v7 Design System -->
    <link rel="stylesheet" href="css/thriftspot-v7.css">

    <!-- Firebase -->
    <script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/init.js"></script>

    <style>
        body {
            height: 100vh;
            overflow: hidden;
        }

        /* ===== SEARCH BAR ===== */
        .search-container {
            position: fixed;
            top: 70px;
            left: var(--space-3);
            right: var(--space-3);
            z-index: 500;
        }

        .search-wrapper {
            position: relative;
            max-width: 500px;
            margin: 0 auto;
        }

        .search-input {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            padding-left: 44px;
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-full);
            background: var(--bg-secondary);
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            font-size: var(--font-sm);
            color: var(--text-primary);
            font-family: inherit;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 2px 16px rgba(99, 102, 241, 0.3);
        }

        .search-input::placeholder {
            color: var(--text-tertiary);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: var(--space-2);
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 600; /* Above filter bar */
        }

        .search-suggestions.active {
            display: block;
        }

        .suggestion-item {
            padding: var(--space-3) var(--space-4);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: var(--space-3);
            border-bottom: 1px solid var(--border-primary);
            transition: background 0.2s ease;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: var(--bg-hover);
        }

        .suggestion-emoji {
            font-size: 20px;
            flex-shrink: 0;
        }

        .suggestion-text {
            flex: 1;
            min-width: 0;
        }

        .suggestion-title {
            font-weight: 600;
            color: var(--text-primary);
            font-size: var(--font-sm);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .suggestion-meta {
            font-size: var(--font-xs);
            color: var(--text-tertiary);
        }

        .suggestion-price {
            font-weight: 700;
            color: var(--accent-success);
            font-size: var(--font-sm);
            flex-shrink: 0;
        }

        .no-results {
            padding: var(--space-4);
            text-align: center;
            color: var(--text-tertiary);
            font-size: var(--font-sm);
        }

        /* ===== CATEGORY FILTER ===== */
        .category-filter-wrapper {
            position: relative;
        }

        .category-filter {
            display: flex;
            gap: var(--space-2);
            margin-top: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-2);
            padding-right: 40px; /* Space for peek effect */
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
        }

        .category-filter::-webkit-scrollbar {
            display: none;
        }

        /* Peek indicator - gradient fade on right edge */
        .category-filter-wrapper::after {
            content: '';
            position: absolute;
            right: 0;
            top: var(--space-2);
            bottom: var(--space-2);
            width: 50px;
            background: linear-gradient(to left, var(--bg-primary) 0%, var(--bg-primary) 30%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }

        .category-chip {
            padding: var(--space-2) var(--space-3);
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-full);
            font-size: var(--font-xs);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            font-family: inherit;
            scroll-snap-align: start;
            flex-shrink: 0;
        }

        .category-chip:hover {
            background: var(--bg-hover);
            border-color: var(--accent-primary);
        }

        .category-chip.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: var(--text-primary);
        }

        /* ===== MAP CONTAINER ===== */
        .map-container {
            position: fixed;
            top: 130px;
            left: 0;
            right: 0;
            bottom: 80px;
            padding: var(--space-3);
        }

        #map {
            height: 100%;
            width: 100%;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-primary);
        }

        /* Override Leaflet controls for dark theme */
        .leaflet-control-zoom a {
            background: var(--bg-secondary) !important;
            color: var(--text-primary) !important;
            border-color: var(--border-primary) !important;
        }

        .leaflet-control-zoom a:hover {
            background: var(--bg-hover) !important;
        }

        .leaflet-control-attribution {
            background: rgba(15, 23, 42, 0.8) !important;
            color: var(--text-tertiary) !important;
            font-size: 10px !important;
        }

        .leaflet-control-attribution a {
            color: var(--text-secondary) !important;
        }

        /* ===== PIN PANEL BACKDROP ===== */
        .pin-panel-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .pin-panel-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        /* ===== PIN INFO PANEL ===== */
        .pin-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 400px;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-primary);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            z-index: 999;
            max-height: 80vh;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .pin-panel.active {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            visibility: visible;
        }

        /* Mobile: Bottom sheet style - completely hidden until active */
        @media (max-width: 768px) {
            .pin-panel {
                position: fixed;
                top: auto;
                bottom: 80px;
                left: 0;
                right: 0;
                width: 100%;
                max-width: none;
                border-radius: var(--radius-lg) var(--radius-lg) 0 0;
                transform: translateY(100%);
                max-height: 60vh;
                opacity: 0;
                visibility: hidden;
            }

            .pin-panel.active {
                transform: translateY(0);
                opacity: 1;
                visibility: visible;
            }

            .pin-panel-backdrop {
                display: none;
            }
        }

        .pin-panel-header {
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            z-index: 1;
        }

        .pin-panel-header h3 {
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .pin-panel-close {
            background: var(--bg-card);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-tertiary);
            transition: all var(--transition-fast);
        }

        .pin-panel-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .pin-panel-content {
            padding: var(--space-4);
        }

        /* ===== PIN CONTENT STYLES ===== */
        .pin-images {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
            overflow-x: auto;
            padding-bottom: var(--space-2);
        }

        .pin-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-primary);
            flex-shrink: 0;
        }

        .pin-title {
            font-size: var(--font-lg);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            line-height: 1.3;
        }

        .pin-price {
            font-size: var(--font-2xl);
            font-weight: 700;
            color: var(--accent-success);
            margin-bottom: var(--space-2);
        }

        .pin-meta {
            display: flex;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            font-size: var(--font-xs);
            color: var(--text-tertiary);
        }

        .pin-description {
            color: var(--text-secondary);
            font-size: var(--font-sm);
            line-height: 1.5;
            margin-bottom: var(--space-4);
            white-space: pre-line; /* Preserve line breaks from itemized descriptions */
        }

        .pin-location {
            font-size: var(--font-xs);
            color: var(--text-tertiary);
            margin-bottom: var(--space-4);
        }

        .pin-status-badge {
            display: inline-block;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: var(--space-3);
        }

        .status-available {
            background: rgba(34, 197, 94, 0.15);
            color: var(--accent-success);
        }

        .status-reserved {
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent-warning);
        }

        .status-claimed {
            background: rgba(239, 68, 68, 0.15);
            color: var(--accent-error);
        }

        .pin-actions {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
        }

        .pin-actions .btn {
            width: 100%;
            justify-content: center;
        }

        /* ===== BUTTONS ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--font-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
            border: none;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--text-primary);
        }

        .btn-primary:hover {
            background: #4f46e5;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-tertiary);
            border: 1px solid var(--border-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-danger {
            background: var(--accent-error);
            color: var(--text-primary);
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-primary);
        }

        .btn-outline:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-share {
            background: #3b82f6;
            color: var(--text-primary);
        }

        .btn-share:hover {
            background: #2563eb;
        }

        /* ===== YARD SALE POPUP ===== */
        .yard-sale-title {
            font-size: var(--font-base);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-3);
        }

        .yard-sale-items-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-2);
            max-height: 300px;
            overflow-y: auto;
        }

        .yard-sale-item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3);
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 1px solid var(--border-primary);
        }

        .yard-sale-item-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent-primary);
        }

        .yard-sale-item-name {
            font-size: var(--font-sm);
            font-weight: 600;
            color: var(--text-primary);
        }

        .yard-sale-item-price {
            font-size: var(--font-sm);
            font-weight: 700;
            color: var(--accent-success);
        }

        /* ===== USER AVATAR ===== */
        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--accent-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: var(--font-sm);
            text-decoration: none;
        }

        /* ===== HAMBURGER DROPDOWN ===== */
        .hamburger-dropdown {
            position: fixed;
            top: 60px;
            left: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 0 0 var(--radius-md) var(--radius-md);
            min-width: 200px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        .hamburger-dropdown.show {
            display: block;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-3) var(--space-4);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--font-sm);
            transition: all var(--transition-fast);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .menu-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            color: var(--text-tertiary);
        }

        .menu-divider {
            height: 1px;
            background: var(--border-primary);
            margin: var(--space-2) 0;
        }

        /* ===== CUSTOM ALERT MODAL ===== */
        .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: var(--space-4);
            backdrop-filter: blur(8px);
        }

        .custom-alert-content {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: var(--space-6);
            max-width: 400px;
            width: 100%;
            border: 1px solid var(--border-primary);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .custom-alert-content h3 {
            color: var(--text-primary);
            margin-bottom: var(--space-3);
        }

        .custom-alert-content p {
            color: var(--text-secondary);
            margin-bottom: var(--space-4);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .map-container {
                padding: var(--space-2);
            }

            .pin-panel-content {
                padding: var(--space-3);
            }

            .pin-image {
                width: 64px;
                height: 64px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <button class="hamburger-menu" id="hamburgerMenu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="header-logo">
            <span style="font-size: var(--font-lg); font-weight: 700; color: var(--text-primary);">ThriftSpot</span>
        </div>

        <div id="authSection"></div>
    </header>

    <!-- Hamburger Dropdown Menu -->
    <div class="hamburger-dropdown" id="hamburgerDropdown">
        <a href="dashboard.html" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Dashboard
        </a>
        <a href="profile.html" class="menu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
        </a>
        <div class="menu-divider"></div>
        <button class="menu-item" id="signOutBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Sign Out
        </button>
    </div>

    <!-- Search and Filter -->
    <div class="search-container">
        <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Search items nearby...">
            <div class="search-suggestions" id="searchSuggestions">
                <!-- Suggestions will be populated dynamically -->
            </div>
        </div>
        <div class="category-filter-wrapper">
            <div class="category-filter" id="categoryFilter">
                <button class="category-chip active" data-category="all">All</button>
                <button class="category-chip" data-category="electronics">📱 Electronics</button>
                <button class="category-chip" data-category="furniture">🪑 Furniture</button>
                <button class="category-chip" data-category="clothing">👕 Clothing</button>
                <button class="category-chip" data-category="tools">🔧 Tools</button>
                <button class="category-chip" data-category="books">📚 Books</button>
                <button class="category-chip" data-category="toys">🧸 Toys</button>
                <button class="category-chip" data-category="sports">⚽ Sports</button>
                <button class="category-chip" data-category="automotive">🚗 Automotive</button>
                <button class="category-chip" data-category="jewelry">💎 Jewelry</button>
                <button class="category-chip" data-category="collectibles">🏆 Collectibles</button>
            </div>
        </div>
    </div>

    <!-- Map Container -->
    <div class="map-container">
        <div id="map"></div>
    </div>

    <!-- Mode Toggle -->
    <div class="mode-toggle" id="modeToggle">
        <div class="mode-toggle-slider slide-left"></div>
        <button class="mode-btn active" id="thriftBtn" data-mode="thrift">
            <span>🗺️</span>
            <span>Thrift</span>
        </button>
        <button class="mode-btn" id="spotBtn" data-mode="spot">
            <span>📷</span>
            <span>Spot</span>
        </button>
    </div>

    <!-- Pin Panel Backdrop -->
    <div class="pin-panel-backdrop" id="pinPanelBackdrop"></div>

    <!-- Pin Info Panel -->
    <div class="pin-panel" id="pinPanel">
        <div class="pin-panel-header">
            <h3 id="pinPanelTitle"><!-- Dynamic title --></h3>
            <button class="pin-panel-close" id="closePinPanel">✕</button>
        </div>
        <div class="pin-panel-content" id="pinPanelContent">
            <!-- Content will be dynamically populated -->
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- JavaScript -->
    <script src="shared/api-client.js"></script>
    <script src="js/token-system.js"></script>
    <script>
        class MapApp {
            constructor() {
                this.currentUser = null;
                this.map = null;
                this.markers = [];
                this.allPins = [];
                this.filteredPins = [];
                this.selectedPin = null;
                this.userLocation = null;
                this.activeCategory = 'all';
                this.searchTimeout = null;
            }

            async init() {
                console.log('🗺️ Map App v7 initializing...');

                await this.initAuth();
                this.initMap();
                await this.loadPins();
                this.setupEventListeners();
                this.setupSearch();
                this.setupCategoryFilter();

                // Check for specific pin in URL
                const urlParams = new URLSearchParams(window.location.search);
                const pinId = urlParams.get('pin');
                const collectionId = urlParams.get('collection');

                if (pinId) {
                    this.showPinDetails(pinId);
                } else if (collectionId) {
                    this.showCollectionFromUrl(collectionId);
                }

                console.log('✅ Map App v7 ready!');
            }

            setupSearch() {
                const searchInput = document.getElementById('searchInput');
                const suggestionsContainer = document.getElementById('searchSuggestions');

                searchInput.addEventListener('input', (e) => {
                    clearTimeout(this.searchTimeout);
                    this.searchTimeout = setTimeout(() => {
                        this.handleSearch(e.target.value);
                    }, 200);
                });

                searchInput.addEventListener('focus', () => {
                    if (searchInput.value.length > 0) {
                        this.handleSearch(searchInput.value);
                    }
                });

                // Close suggestions when clicking outside
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.search-wrapper')) {
                        suggestionsContainer.classList.remove('active');
                    }
                });
            }

            handleSearch(query) {
                const suggestionsContainer = document.getElementById('searchSuggestions');

                if (query.length < 1) {
                    suggestionsContainer.classList.remove('active');
                    return;
                }

                const queryLower = query.toLowerCase();
                const matches = this.allPins.filter(pin => {
                    const title = (pin.title || '').toLowerCase();
                    const category = (pin.category || '').toLowerCase();
                    const brand = (pin.brand || '').toLowerCase();
                    const description = (pin.description || '').toLowerCase();

                    return title.includes(queryLower) ||
                           category.includes(queryLower) ||
                           brand.includes(queryLower) ||
                           description.includes(queryLower);
                }).slice(0, 8);

                if (matches.length === 0) {
                    suggestionsContainer.innerHTML = `<div class="no-results">No items found for "${query}"</div>`;
                } else {
                    suggestionsContainer.innerHTML = matches.map(pin => {
                        const emoji = this.getCategoryEmoji(pin.category);
                        const displayTitle = this.buildDisplayTitle(pin);
                        return `
                            <div class="suggestion-item" data-pin-id="${pin.id}">
                                <span class="suggestion-emoji">${emoji}</span>
                                <div class="suggestion-text">
                                    <div class="suggestion-title">${displayTitle}</div>
                                    <div class="suggestion-meta">${pin.category || 'General'} • ${pin.condition || 'Good'}</div>
                                </div>
                                <span class="suggestion-price">$${pin.price || 0}</span>
                            </div>
                        `;
                    }).join('');

                    // Add click handlers
                    suggestionsContainer.querySelectorAll('.suggestion-item').forEach(item => {
                        item.addEventListener('click', () => {
                            const pinId = item.dataset.pinId;
                            this.showPinDetails(pinId);
                            suggestionsContainer.classList.remove('active');
                            document.getElementById('searchInput').value = '';
                        });
                    });
                }

                suggestionsContainer.classList.add('active');
            }

            // Check if a pin matches a broad category
            matchesBroadCategory(pin, filterCategory) {
                const categoryMapping = this.getCategoryMapping();
                const keywords = categoryMapping[filterCategory] || [];

                // Get all searchable text from the pin
                const pinCategory = (pin.category || '').toLowerCase();
                const pinTitle = (pin.title || '').toLowerCase();
                const pinBrand = (pin.brand || '').toLowerCase();
                const pinDescription = (pin.description || '').toLowerCase();
                const pinModel = (pin.model || '').toLowerCase();

                const searchText = `${pinCategory} ${pinTitle} ${pinBrand} ${pinDescription} ${pinModel}`;

                // Check if any keyword matches
                return keywords.some(keyword => searchText.includes(keyword.toLowerCase()));
            }

            filterByCategory(category) {
                // Clear existing markers
                this.markers.forEach(({ marker }) => this.map.removeLayer(marker));
                this.markers = [];

                // Filter pins
                if (category === 'all') {
                    this.filteredPins = [...this.allPins];
                } else {
                    // Use broad category matching instead of exact match
                    this.filteredPins = this.allPins.filter(pin => this.matchesBroadCategory(pin, category));
                }

                // Re-render markers with filtered pins
                const groupedPins = this.groupPinsByProximity(this.filteredPins, 0.1);
                groupedPins.forEach(group => {
                    if (group.pins.length === 1) {
                        this.addPinToMap(group.pins[0]);
                    } else {
                        this.addYardSaleToMap(group);
                    }
                });

                console.log(`📍 Showing ${this.filteredPins.length} pins for category: ${category}`);
            }

            // Build display title without unknown attributes
            buildDisplayTitle(pin) {
                const parts = [];

                // Only add brand if it's known and not "Unknown"
                if (pin.brand && pin.brand.toLowerCase() !== 'unknown' && pin.brand.toLowerCase() !== 'unbranded') {
                    parts.push(pin.brand);
                }

                // Add title or category
                if (pin.title && pin.title.toLowerCase() !== 'unknown' && pin.title.toLowerCase() !== 'untitled') {
                    // If title doesn't already contain the brand, use it
                    if (!parts.some(p => pin.title.toLowerCase().includes(p.toLowerCase()))) {
                        parts.push(pin.title);
                    } else {
                        return pin.title; // Title already contains brand
                    }
                } else if (pin.category && pin.category.toLowerCase() !== 'unknown') {
                    parts.push(pin.category);
                }

                return parts.length > 0 ? parts.join(' ') : 'Item for Sale';
            }

                    const initials = this.getUserInitials(displayName);

            getUserInitials(name) {
                if (!name) return 'U';
                if (name.includes('@')) return name.substring(0, 2).toUpperCase();
                const parts = name.trim().split(' ');
                if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
                return name.substring(0, 2).toUpperCase();
            }

                }).addTo(this.map);

                // User location
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((position) => {
                        this.userLocation = {

                                iconSize: [18, 18]

            async loadPins() {
                const db = firebase.firestore();
                const pinsSnapshot = await db.collection('pins')
                    .where('status', '==', 'active')
                    .get();

                this.allPins = [];
                pinsSnapshot.forEach((doc) => {
                    this.allPins.push({ id: doc.id, ...doc.data() });
                });
                this.filteredPins = [...this.allPins];

                console.log(`📍 Loaded ${this.allPins.length} pins`);

                const groupedPins = this.groupPinsByProximity(this.allPins, 0.1);
                console.log(`📍 Grouped into ${groupedPins.length} locations`);

                groupedPins.forEach(group => {
                    if (group.pins.length === 1) {
                        this.addPinToMap(group.pins[0]);
                    } else {
                        this.addYardSaleToMap(group);
                    }
                });

                // Fit map to show nearest items after loading
                this.fitToNearestItems(5);
            }

            // Dynamic zoom to nearest items
            fitToNearestItems(count = 5) {
                if (this.markers.length === 0) return;

                // If we have user location, sort by distance; otherwise show all
                if (this.userLocation) {
                    // Sort markers by distance from user
                    const markersWithDistance = this.markers
                        .filter(m => m.marker && m.marker.getLatLng)
                        .map(m => {
                            const latlng = m.marker.getLatLng();
                            const distance = this.calculateDistance(
                                this.userLocation.lat, this.userLocation.lng,
                                latlng.lat, latlng.lng
                            );
                            return { marker: m.marker, distance };
                        })
                        .sort((a, b) => a.distance - b.distance)
                        .slice(0, count);

                    if (markersWithDistance.length > 0) {
                        // Create bounds from nearest items + user location
                        const bounds = L.latLngBounds([
                            [this.userLocation.lat, this.userLocation.lng]
                        ]);

                        markersWithDistance.forEach(({ marker }) => {
                            bounds.extend(marker.getLatLng());
                        });

                        this.map.fitBounds(bounds, { padding: [50, 50], maxZoom: 15 });
                        console.log(`📍 Zoomed to show ${markersWithDistance.length} nearest items`);
                    }
                } else {
                    // No user location - show all pins
                    if (this.markers.length > 0) {
                        const bounds = L.latLngBounds(
                            this.markers
                                .filter(m => m.marker && m.marker.getLatLng)
                                .map(m => m.marker.getLatLng())
                        );
                        if (bounds.isValid()) {
                            this.map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
                            console.log(`📍 Zoomed to show all ${this.markers.length} items`);
                        }
                    }
                }
            }

            groupPinsByProximity(pins, radiusMiles) {
                const groups = [];
                const processed = new Set();

                pins.forEach(pin => {
                    if (processed.has(pin.id)) return;

                    const group = {
                        center: { lat: pin.lat, lng: pin.lng },
                        pins: [pin]
                    };

                    pins.forEach(otherPin => {
                        if (otherPin.id === pin.id || processed.has(otherPin.id)) return;

                        const distance = this.calculateDistance(
                            pin.lat, pin.lng,
                            otherPin.lat, otherPin.lng
                        );

                        const shouldGroup = (pin.userId === otherPin.userId && distance <= radiusMiles) ||
                                           (distance <= radiusMiles / 4);

                        if (shouldGroup) {
                            group.pins.push(otherPin);
                            processed.add(otherPin.id);
                        }
                    });

                    processed.add(pin.id);
                    groups.push(group);
                });

                return groups;
            }

            calculateDistance(lat1, lon1, lat2, lon2) {
                const R = 3959;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                         Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                         Math.sin(dLon / 2) * Math.sin(dLon / 2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                return R * c;
            }

            addYardSaleToMap(group) {
                const itemCount = group.pins.length;

                const categoryCounts = {};
                let mostCommonCategory = null;
                let maxCount = 0;

                group.pins.forEach(pin => {
                    const category = pin.category || 'unknown';
                    categoryCounts[category] = (categoryCounts[category] || 0) + 1;
                    if (categoryCounts[category] > maxCount) {
                        maxCount = categoryCounts[category];
                        mostCommonCategory = category;
                    }
                });

                const categoryEmoji = this.getCategoryEmoji(mostCommonCategory);

                const icon = L.divIcon({
                    className: 'yard-sale-marker',
                    html: `<div style="background: #8b5cf6; color: white; min-width: 48px; height: 48px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer; padding: 6px;">
                        <div style="font-size: 16px; margin-bottom: 1px;">${categoryEmoji}</div>
                        <div style="font-size: 9px; font-weight: 700;">${itemCount}</div>
                    </div>`,
                    iconSize: [52, 52]
                });

                const marker = L.marker([group.center.lat, group.center.lng], { icon })
                    .addTo(this.map)
                    .on('click', () => this.showYardSaleDetails(group));

                this.markers.push({ id: `yard-sale-${group.pins[0].id}`, marker, isYardSale: true, group });
            }

            async shareCollection() {
                if (!this.currentCollection) return;

                const group = this.currentCollection;
                const collectionId = group.pins.map(p => p.id).join(',');
                const sharerId = this.currentUser?.uid || 'anon';
                const shareUrl = `${window.location.origin}/pin-map.html?collection=${collectionId}&ref=${sharerId}`;
                const shareTitle = `${group.pins.length} items nearby on ThriftSpot`;
                const shareText = `Found ${group.pins.length} items nearby! Check them out on ThriftSpot.`;

                // Use Web Share API on mobile if available
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: shareTitle,
                            text: shareText,
                            url: shareUrl
                        });
                        console.log('✅ Collection shared via Web Share API');
                        return;
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.log('Web Share failed, falling back to copy:', err);
                        } else {
                            return;
                        }
                    }
                }

                // Fallback: Copy to clipboard
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    this.showCustomAlert(`
                        <h3>📤 Share Collection</h3>
                        <p style="word-break: break-all; font-size: 12px; background: var(--bg-card); padding: 8px; border-radius: 4px; margin-bottom: 16px;">${shareUrl}</p>
                        <p style="color: var(--accent-success); margin-bottom: 16px;">✓ Link copied to clipboard!</p>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <a href="https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}" target="_blank" class="btn btn-primary" style="flex: 1; min-width: 120px;">WhatsApp</a>
                            <a href="sms:?body=${encodeURIComponent(shareText + ' ' + shareUrl)}" class="btn btn-primary" style="flex: 1; min-width: 120px;">SMS</a>
                        </div>
                    `);
                } catch (err) {
                    console.error('Copy failed:', err);
                    this.showCustomAlert(`
                        <h3>📤 Share Collection</h3>
                        <p>Copy this link:</p>
                        <input type="text" value="${shareUrl}" style="width: 100%; padding: 8px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-primary);" onclick="this.select();" readonly>
                    `);
                }
            }

                    const group = {
                        center: { lat: matchingPins[0].lat, lng: matchingPins[0].lng },
                        pins: matchingPins

                    this.showYardSaleDetails(group);

                    // Center map on collection
                    if (matchingPins[0].lat && matchingPins[0].lng) {
                        this.map.setView([matchingPins[0].lat, matchingPins[0].lng], 15);
                    }

            addPinToMap(pin) {
                if (!pin.lat || !pin.lng) {
                    console.warn('Pin missing coordinates:', pin.id);
                    return;
                }

                const icon = this.getPinIcon(pin);
                const marker = L.marker([pin.lat, pin.lng], { icon })
                    .addTo(this.map)
                    .on('click', () => this.showPinDetails(pin.id));

                this.markers.push({ id: pin.id, marker });
            }

            getPinIcon(pin) {
                // Default: Friendly yellow for available/unknown
                let bgColor = '#fbbf24';
                let textColor = 'black';

                if (pin.claimedBy) {
                    bgColor = '#ef4444'; // red for claimed
                    textColor = 'white';
                } else if (pin.reservedBy) {
                    bgColor = '#eab308'; // darker amber for reserved
                    textColor = 'white';
                }

                const icon = this.getCategoryIcon(pin.category);
                // If icon is "?" use black text, otherwise use white for emojis
                const displayColor = icon === '?' ? 'black' : textColor;

                return L.divIcon({
                    className: 'custom-pin-marker',
                    html: `<div style="background: ${bgColor}; color: ${displayColor}; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: ${icon === '?' ? '20px' : '16px'}; font-weight: ${icon === '?' ? '700' : '400'}; border: 2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.4); cursor: pointer;">${icon}</div>`,
                    iconSize: [40, 40]
                });
            }

            getCategoryIcon(category) {
                const icons = {
                    'electronics': '📱',
                    'furniture': '🪑',
                    'clothing': '👕',
                    'footwear': '👟',
                    'tools': '🔧',
                    'books': '📚',
                    'toys': '🧸',
                    'automotive': '🚗',
                    'sporting goods': '⚽',
                    'sports': '⚽',
                    'jewelry': '💎',
                    'home & garden': '🏡',
                    'collectibles': '🏆'
                };
                return icons[category?.toLowerCase()] || '?';
            }

            // Keep getCategoryEmoji for backwards compatibility in search
            getCategoryEmoji(category) {
                return this.getCategoryIcon(category);
            }

            async showPinDetails(pinId) {
                const db = firebase.firestore();
                const pinDoc = await db.collection('pins').doc(pinId).get();

                if (!pinDoc.exists) {
                    console.error('Pin not found:', pinId);
                    return;
                }

                const pin = { id: pinDoc.id, ...pinDoc.data() };
                this.selectedPin = pin;

                // Center map on pin
                if (pin.lat && pin.lng) {
                    this.map.setView([pin.lat, pin.lng], 16);
                }

                await this.renderPinPanel(pin);

                document.getElementById('pinPanel').classList.add('active');
                document.getElementById('pinPanelBackdrop').classList.add('active');
            }

            getTimeAgo(date) {
                if (!date) return '';
                const dateObj = date.toDate ? date.toDate() : new Date(date);
                const seconds = Math.floor((new Date() - dateObj) / 1000);
                let interval = seconds / 31536000;
                if (interval > 1) return Math.floor(interval) + 'y ago';
                interval = seconds / 2592000;
                if (interval > 1) return Math.floor(interval) + 'mo ago';
                interval = seconds / 86400;
                if (interval > 1) return Math.floor(interval) + 'd ago';
                interval = seconds / 3600;
                if (interval > 1) return Math.floor(interval) + 'h ago';
                interval = seconds / 60;
                if (interval > 1) return Math.floor(interval) + 'm ago';
                return 'Just now';
            }

            async renderPinPanel(pin) {
                const isOwner = this.currentUser && pin.userId === this.currentUser.uid;
                const isReserved = !!pin.reservedBy;
                const isClaimed = !!pin.claimedBy;
                const canReserve = this.currentUser && !isOwner && !isReserved && !isClaimed;
                const canClaim = this.currentUser && !isOwner && isReserved && pin.reservedBy === this.currentUser.uid;

                // Build display title without unknown attributes
                const displayTitle = this.buildDisplayTitle(pin);

                // Set panel title to item name and price (removing "Item Details")
                document.getElementById('pinPanelTitle').textContent = `${displayTitle} - $${pin.price || '0'}`;

                let statusBadge = '';
                if (isClaimed) {
                    statusBadge = '<span class="pin-status-badge status-claimed">Claimed</span>';
                } else if (isReserved) {
                    statusBadge = '<span class="pin-status-badge status-reserved">Reserved</span>';
                } else {
                    statusBadge = '<span class="pin-status-badge status-available">Available</span>';
                }

                const images = pin.images && pin.images.length > 0
                    ? `<div class="pin-images">${pin.images.map(url => `<img src="${url}" class="pin-image" alt="Item">`).join('')}</div>`
                    : '';

                const listingType = pin.listingType === 'rent'
                    ? `<span class="meta-item">📅 Rent (${pin.rentalPeriod})</span>`
                    : '<span class="meta-item">💰 Sale</span>';

                let actions = '';
                if (isOwner) {
                    actions = `
                        <button class="btn btn-secondary">Edit</button>
                        <button class="btn btn-danger" onclick="app.deletePinListing('${pin.id}')">Delete</button>
                    `;
                } else if (canClaim) {
                    actions = `
                        <button class="btn btn-primary" onclick="app.claimPin('${pin.id}')">Claim (10 🪙)</button>
                        <button class="btn btn-secondary" onclick="app.cancelReservation('${pin.id}')">Cancel</button>
                    `;
                } else if (canReserve) {
                    actions = `
                        <button class="btn btn-primary" onclick="app.reservePin('${pin.id}')">Reserve 1h (1 🪙)</button>
                        <button class="btn btn-secondary" onclick="app.messageSeller('${pin.id}')">Message</button>
                    `;
                } else if (!this.currentUser) {
                    actions = `<a href="signin.html" class="btn btn-primary">Sign In to Reserve</a>`;
                }

                const listedDate = pin.createdAt || pin.created_at || pin.timestamp;
                const listedTimeAgo = listedDate ? this.getTimeAgo(listedDate) : '';

                // Get location - reverse geocode if only lat/lng available
                let locationDisplay = pin.location;
                if (!locationDisplay && pin.lat && pin.lng) {
                    locationDisplay = await this.reverseGeocode(pin.lat, pin.lng);
                }

                document.getElementById('pinPanelContent').innerHTML = `
                    ${statusBadge}
                    <div class="pin-meta">
                        ${listingType}
                        <span class="meta-item">📦 ${pin.category || 'General'}</span>
                        <span class="meta-item">⭐ ${pin.condition || 'Good'}</span>
                        ${listedTimeAgo ? `<span class="meta-item">🕐 ${listedTimeAgo}</span>` : ''}
                    </div>
                    ${images}
                    <p class="pin-description">${pin.description || 'No description.'}</p>
                    ${locationDisplay ? `<p class="pin-location">📍 ${locationDisplay}</p>` : ''}
                    <div class="pin-actions">
                        <button class="btn btn-share" onclick="app.sharePin('${pin.id}')">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="18" cy="5" r="3"></circle>
                                <circle cx="6" cy="12" r="3"></circle>
                                <circle cx="18" cy="19" r="3"></circle>
                                <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                                <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                            </svg>
                            Share Find
                        </button>
                        <a href="listing.html?id=${pin.id}" class="btn btn-outline">View Full Listing →</a>
                        ${actions}
                    </div>
                `;
            }

            async reservePin(pinId) {
                if (!this.currentUser) {
                    window.location.href = 'signin.html';
                    return;
                }

                const tokenResult = await window.tokenSystem.spendTokens('reserve', { relatedId: pinId });
                if (!tokenResult.success) {
                    console.error('❌ Failed to spend tokens:', tokenResult.error);
                    return;
                }

                console.log(`✅ Spent ${tokenResult.amount} tokens for reserve.`);

                try {
                    const db = firebase.firestore();
                    const reservedUntil = new Date();
                    reservedUntil.setHours(reservedUntil.getHours() + 1);

                    await db.collection('pins').doc(pinId).update({
                        reservedBy: this.currentUser.uid,
                        reservedByEmail: this.currentUser.email,
                        reservedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        reservedUntil: firebase.firestore.Timestamp.fromDate(reservedUntil),
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    this.showCustomAlert(`
                        <h3>✅ Reserved!</h3>
                        <p>Item reserved for 1 hour. Go get it!</p>
                        <a href="listing.html?id=${pinId}" class="btn btn-primary" style="width: 100%;">View Listing</a>
                    `);
                    this.showPinDetails(pinId);
                    this.reloadPins();

                } catch (error) {
                    console.error('Error reserving pin:', error);
                    alert('Failed to reserve: ' + error.message);
                }
            }

            async claimPin(pinId) {
                if (!this.currentUser) {
                    window.location.href = 'signin.html';
                    return;
                }

                if (!confirm('Claim this item for 10 tokens?')) return;

                const tokenResult = await window.tokenSystem.spendTokens('claim', { relatedId: pinId });
                if (!tokenResult.success) {
                    console.error('❌ Failed to spend tokens:', tokenResult.error);
                    return;
                }

                try {
                    const db = firebase.firestore();
                    const pinDoc = await db.collection('pins').doc(pinId).get();
                    const pinData = pinDoc.data();

                    await db.collection('pins').doc(pinId).update({
                        claimedBy: this.currentUser.uid,
                        claimedByEmail: this.currentUser.email,
                        claimedAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'claimed',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('🎉 Item claimed!');
                    this.closePinPanel();
                    this.reloadPins();

                } catch (error) {
                    console.error('Error claiming pin:', error);
                    alert('Failed to claim: ' + error.message);
                }
            }

            async cancelReservation(pinId) {
                try {
                    const db = firebase.firestore();
                    await db.collection('pins').doc(pinId).update({
                        reservedBy: null,
                        reservedByEmail: null,
                        reservedAt: null,
                        reservedUntil: null,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('Reservation cancelled.');
                    this.showPinDetails(pinId);
                    this.reloadPins();
                } catch (error) {
                    console.error('Error cancelling reservation:', error);
                    alert('Failed to cancel: ' + error.message);
                }
            }

            messageSeller(pinId) {
                if (!this.currentUser) {
                    window.location.href = 'signin.html';
                    return;
                }

                this.showCustomAlert(`
                    <h3>📧 Contact Seller</h3>
                    <p>View the full listing for contact info.</p>
                    <a href="listing.html?id=${pinId}" class="btn btn-primary" style="width: 100%;">View Listing</a>
                `);
            }

            async sharePin(pinId) {
                const pin = this.selectedPin;
                const sharerId = this.currentUser?.uid || 'anon';
                const shareUrl = `${window.location.origin}/pin-map.html?pin=${pinId}&ref=${sharerId}`;
                const shareTitle = pin?.title || 'Check out this find!';
                const shareText = pin?.price
                    ? `Found this for $${pin.price}! ${shareTitle}`
                    : `Check out this find: ${shareTitle}`;

                // Use Web Share API on mobile if available
                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: shareTitle,
                            text: shareText,
                            url: shareUrl
                        });
                        console.log('✅ Shared successfully via Web Share API');
                        return;
                    } catch (err) {
                        if (err.name !== 'AbortError') {
                            console.log('Web Share failed, falling back to copy:', err);
                        } else {
                            return; // User cancelled
                        }
                    }
                }

                // Fallback: Copy to clipboard and show share options
                try {
                    await navigator.clipboard.writeText(shareUrl);
                    this.showCustomAlert(`
                        <h3>📤 Share This Find</h3>
                        <p style="word-break: break-all; font-size: 12px; background: var(--bg-card); padding: 8px; border-radius: 4px; margin-bottom: 16px;">${shareUrl}</p>
                        <p style="color: var(--accent-success); margin-bottom: 16px;">✓ Link copied to clipboard!</p>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <a href="https://wa.me/?text=${encodeURIComponent(shareText + ' ' + shareUrl)}" target="_blank" class="btn btn-primary" style="flex: 1; min-width: 120px;">WhatsApp</a>
                            <a href="sms:?body=${encodeURIComponent(shareText + ' ' + shareUrl)}" class="btn btn-primary" style="flex: 1; min-width: 120px;">SMS</a>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px;">
                            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(shareText)}&url=${encodeURIComponent(shareUrl)}" target="_blank" class="btn btn-secondary" style="flex: 1; min-width: 120px;">Twitter</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" class="btn btn-secondary" style="flex: 1; min-width: 120px;">Facebook</a>
                        </div>
                    `);
                } catch (err) {
                    console.error('Copy failed:', err);
                    this.showCustomAlert(`
                        <h3>📤 Share This Find</h3>
                        <p>Copy this link:</p>
                        <input type="text" value="${shareUrl}" style="width: 100%; padding: 8px; background: var(--bg-card); border: 1px solid var(--border-primary); border-radius: 4px; color: var(--text-primary);" onclick="this.select();" readonly>
                    `);
                }

                // Track share event
                console.log('📤 Share initiated for pin:', pinId);
            }

            showCustomAlert(htmlContent) {
                let modal = document.getElementById('customAlertModal');
                if (!modal) {
                    modal = document.createElement('div');
                    modal.id = 'customAlertModal';
                    modal.className = 'custom-alert-overlay';

                    const content = document.createElement('div');
                    content.className = 'custom-alert-content';
                    modal.appendChild(content);
                    document.body.appendChild(modal);

                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) modal.remove();
                    });
                }

                const content = modal.querySelector('.custom-alert-content');
                content.innerHTML = htmlContent + `
                    <button class="btn btn-secondary" style="width: 100%; margin-top: var(--space-3);" onclick="document.getElementById('customAlertModal').remove();">
                        Close
                    </button>
                `;
            }

            async reverseGeocode(lat, lng) {
                try {
                    // Use Nominatim (OpenStreetMap) for reverse geocoding - free and no API key required
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                        headers: {
                            'Accept': 'application/json',
                            'User-Agent': 'ThriftSpot/1.0'
                        }
                    });

                    if (!response.ok) {
                        console.warn('Reverse geocode failed:', response.status);
                        return null;
                    }

                    const data = await response.json();

                    if (data && data.address) {
                        const addr = data.address;
                        // Build a short, useful address
                        const parts = [];

                        if (addr.house_number && addr.road) {
                            parts.push(`${addr.house_number} ${addr.road}`);
                        } else if (addr.road) {
                            parts.push(addr.road);
                        }

                        if (addr.city || addr.town || addr.village || addr.suburb) {
                            parts.push(addr.city || addr.town || addr.village || addr.suburb);
                        }

                        return parts.length > 0 ? parts.join(', ') : null;
                    }

                    return null;
                } catch (error) {
                    console.warn('Reverse geocode error:', error);
                    return null;
                }
            }

            async deletePinListing(pinId) {
                if (!confirm('Delete this listing?')) return;

                try {
                    const db = firebase.firestore();
                    await db.collection('pins').doc(pinId).update({
                        status: 'deleted',
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });

                    alert('Listing deleted.');
                    this.closePinPanel();
                    this.reloadPins();
                } catch (error) {
                    console.error('Error deleting pin:', error);
                    alert('Failed to delete: ' + error.message);
                }
            }

            async reloadPins() {
                this.markers.forEach(({ marker }) => this.map.removeLayer(marker));
                this.markers = [];
                await this.loadPins();
            }

            closePinPanel() {
                document.getElementById('pinPanel').classList.remove('active');
                document.getElementById('pinPanelBackdrop').classList.remove('active');
                this.selectedPin = null;
            }

            setupEventListeners() {
                // Close pin panel
                document.getElementById('closePinPanel').addEventListener('click', () => this.closePinPanel());
                document.getElementById('pinPanelBackdrop').addEventListener('click', () => this.closePinPanel());

                // Mode toggle
                const spotBtn = document.getElementById('spotBtn');
                const thriftBtn = document.getElementById('thriftBtn');
                const toggleSlider = document.querySelector('.mode-toggle-slider');

                if (spotBtn) {
                    spotBtn.addEventListener('click', () => {
                        if (toggleSlider) {
                            toggleSlider.classList.remove('slide-left');
                            toggleSlider.classList.add('slide-right');
                        }
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 150);
                    });
                }

                if (thriftBtn) {
                    thriftBtn.addEventListener('click', () => {
                        thriftBtn.classList.add('active');
                        if (spotBtn) spotBtn.classList.remove('active');
                    });
                }

                // Hamburger menu
                const hamburgerMenu = document.getElementById('hamburgerMenu');
                const hamburgerDropdown = document.getElementById('hamburgerDropdown');
                const signOutBtn = document.getElementById('signOutBtn');

                if (hamburgerMenu && hamburgerDropdown) {
                    hamburgerMenu.addEventListener('click', (e) => {
                        e.stopPropagation();
                        hamburgerDropdown.classList.toggle('show');
                    });

                    document.addEventListener('click', (e) => {
                        if (!e.target.closest('.hamburger-menu') && !e.target.closest('.hamburger-dropdown')) {
                            hamburgerDropdown.classList.remove('show');
                        }
                    });

                    hamburgerDropdown.querySelectorAll('a.menu-item').forEach(item => {
                        item.addEventListener('click', () => hamburgerDropdown.classList.remove('show'));
                    });
                }

                if (signOutBtn) {
                    signOutBtn.addEventListener('click', async () => {
                        try {
                            await firebase.auth().signOut();
                            window.location.href = 'signin.html';
                        } catch (error) {
                            console.error('Error signing out:', error);
                        }
                    });
                }
            }
        }

        window.app = new MapApp();

        document.addEventListener('DOMContentLoaded', () => {
            app.init();
        });
    </script>
</body>
