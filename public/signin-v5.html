<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ThriftSpot - Sign In</title>
    <link rel="stylesheet" href="css/thriftspot-mobile.css">

    <!-- Firebase -->
    <script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-auth-compat.js"></script>
    <script src="/__/firebase/init.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-700) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-4);
        }

        .auth-card {
            background: var(--white);
            border-radius: var(--radius-2xl);
            box-shadow: var(--shadow-xl);
            padding: var(--space-8);
            width: 100%;
            max-width: 420px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: var(--space-6);
        }

        .logo {
            font-size: 3rem;
            margin-bottom: var(--space-2);
        }

        .logo-text {
            font-size: var(--text-3xl);
            font-weight: var(--font-bold);
            color: var(--primary-500);
            margin-bottom: var(--space-2);
        }

        .logo-tagline {
            color: var(--gray-500);
            font-size: var(--text-sm);
        }

        .tab-switcher {
            display: flex;
            background: var(--gray-100);
            border-radius: var(--radius-full);
            padding: var(--space-1);
            margin-bottom: var(--space-8);
        }

        .tab-btn {
            flex: 1;
            padding: var(--space-3);
            border: none;
            border-radius: var(--radius-full);
            background: transparent;
            font-size: var(--text-base);
            font-weight: var(--font-semibold);
            color: var(--gray-600);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .tab-btn.active {
            background: var(--white);
            color: var(--primary-500);
            box-shadow: var(--shadow-sm);
        }

        .form-panel {
            display: none;
        }

        .form-panel.active {
            display: block;
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            margin: var(--space-6) 0;
            color: var(--gray-500);
            font-size: var(--text-sm);
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-300);
        }

        .social-btn {
            width: 100%;
            padding: var(--space-4);
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-lg);
            background: var(--white);
            font-size: var(--text-base);
            font-weight: var(--font-medium);
            cursor: pointer;
            transition: all var(--transition-base);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-3);
            margin-bottom: var(--space-3);
        }

        .social-btn:hover {
            background: var(--gray-50);
            border-color: var(--gray-400);
        }

        .error-message {
            background: var(--error-light);
            color: var(--error);
            padding: var(--space-3);
            border-radius: var(--radius-md);
            font-size: var(--text-sm);
            margin-bottom: var(--space-4);
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .forgot-password {
            text-align: center;
            margin-top: var(--space-4);
        }

        .forgot-password a {
            color: var(--primary-500);
            text-decoration: none;
            font-size: var(--text-sm);
            font-weight: var(--font-medium);
        }

        .back-link {
            text-align: center;
            margin-top: var(--space-6);
        }

        .back-link a {
            color: var(--gray-600);
            text-decoration: none;
            font-size: var(--text-sm);
        }

        .back-link a:hover {
            color: var(--gray-900);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="logo-container">
            <div class="logo">📍</div>
            <h1 class="logo-text">ThriftSpot</h1>
            <p class="logo-tagline">Spot treasures, share finds</p>
        </div>

        <!-- Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" data-tab="signin">Sign In</button>
            <button class="tab-btn" data-tab="signup">Sign Up</button>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Sign In Panel -->
        <div class="form-panel active" id="signinPanel">
            <form id="signinForm">
                <div class="form-group">
                    <label class="label">Email</label>
                    <input type="email" class="input" id="signinEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="label">Password</label>
                    <input type="password" class="input" id="signinPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg">
                    Sign In
                </button>
            </form>

            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </div>

            <div class="divider">or continue with</div>

            <button class="social-btn" id="googleSignInBtn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign in with Google
            </button>
        </div>

        <!-- Sign Up Panel -->
        <div class="form-panel" id="signupPanel">
            <form id="signupForm">
                <div class="form-group">
                    <label class="label">Full Name</label>
                    <input type="text" class="input" id="signupName" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label class="label">Email</label>
                    <input type="email" class="input" id="signupEmail" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="label">Password</label>
                    <input type="password" class="input" id="signupPassword" placeholder="••••••••" required minlength="6">
                </div>

                <button type="submit" class="btn btn-primary btn-full btn-lg">
                    Create Account
                </button>
            </form>

            <div class="divider">or continue with</div>

            <button class="social-btn" id="googleSignUpBtn">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Sign up with Google
            </button>
        </div>

        <div class="back-link">
            <a href="index-v5.html">← Back to home</a>
        </div>
    </div>

    <script>
        // Tab Switching
        const tabBtns = document.querySelectorAll('.tab-btn');
        const formPanels = document.querySelectorAll('.form-panel');

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const tab = btn.dataset.tab;

                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                formPanels.forEach(panel => {
                    panel.classList.remove('active');
                    if (panel.id === `${tab}Panel`) {
                        panel.classList.add('active');
                    }
                });

                hideError();
            });
        });

        // Error Handling
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('errorMessage');
            errorEl.classList.remove('show');
        }

        // Sign In
        document.getElementById('signinForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('signinEmail').value;
            const password = document.getElementById('signinPassword').value;

            try {
                await firebase.auth().signInWithEmailAndPassword(email, password);
                window.location.href = 'index-v5.html';
            } catch (error) {
                showError(error.message);
            }
        });

        // Sign Up
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
                await userCredential.user.updateProfile({ displayName: name });
                window.location.href = 'index-v5.html';
            } catch (error) {
                showError(error.message);
            }
        });

        // Google Sign In/Up
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            try {
                await firebase.auth().signInWithPopup(googleProvider);
                window.location.href = 'index-v5.html';
            } catch (error) {
                showError(error.message);
            }
        });

        document.getElementById('googleSignUpBtn').addEventListener('click', async () => {
            try {
                await firebase.auth().signInWithPopup(googleProvider);
                window.location.href = 'index-v5.html';
            } catch (error) {
                showError(error.message);
            }
        });

        // Forgot Password
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signinEmail').value;

            if (!email) {
                showError('Please enter your email address first');
                return;
            }

            try {
                await firebase.auth().sendPasswordResetEmail(email);
                alert('Password reset email sent! Check your inbox.');
            } catch (error) {
                showError(error.message);
            }
        });
    </script>
</body>
</html>
