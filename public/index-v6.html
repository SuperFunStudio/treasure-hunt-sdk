<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#ffffff">
    <title>ThriftSpot - Spot & Thrift</title>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.2/dist/browser-image-compression.min.js"></script>

    <!-- Leaflet for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- v6 Design System -->
    <link rel="stylesheet" href="css/thriftspot-v6.css">

    <!-- Firebase -->
    <script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-storage-compat.js"></script>
    <script src="/__/firebase/init.js"></script>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <div class="header-logo">
          
            <span>ThriftSpot</span>
        </div>

        <div id="authSection">
            <!-- Will be populated with user menu or sign in button -->
        </div>
    </header>

    <!-- TELESCOPE RINGS - ALWAYS VISIBLE -->
    <div class="telescope-container" id="telescopeContainer">
        <div class="telescope-rings">
            <div class="telescope-ring"></div>
            <div class="telescope-ring"></div>
            <div class="telescope-ring"></div>
        </div>

        <!-- Progress ring overlay (only visible during analysis) -->
        <div class="telescope-progress" id="telescopeProgress">
            <svg viewBox="0 0 200 200">
                <circle
                    cx="100"
                    cy="100"
                    r="95"
                    id="progressCircle"
                    style="stroke-dasharray: 597; stroke-dashoffset: 597;">
                </circle>
            </svg>
        </div>
    </div>

    <!-- CENTER CONTENT - IN THE MIDDLE OF RINGS -->
    <div class="telescope-center" id="telescopeCenter">
        <!-- MOBILE: Camera viewfinder -->
        <div class="camera-viewfinder hidden" id="cameraViewfinder">
            <video id="cameraVideo" class="camera-video" autoplay playsinline></video>
            <div class="viewfinder-overlay">
                <div class="viewfinder-crosshair"></div>
            </div>
        </div>

        <!-- DESKTOP: Upload button -->
        <label class="upload-trigger" id="uploadTrigger">
            <input type="file" id="fileInput" accept="image/*" multiple class="sr-only">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
            <p>Upload Photos</p>
        </label>
    </div>

    <!-- PHOTO GALLERY (shows uploaded/captured photos) -->
    <div class="photo-gallery hidden" id="photoGallery">
        <!-- Thumbnails will be added here dynamically -->
    </div>

    <!-- SCAN BUTTON (always visible, disabled until photos added) -->
    <div class="analyze-button-container" id="analyzeButtonContainer">
        <button class="analyze-button" id="analyzeButton" disabled>
            Scan Items
        </button>
        <label class="upload-icon-button" id="uploadIconButton" title="Upload from library">
            <input type="file" id="fileInputMobile" accept="image/*" multiple class="sr-only">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
            </svg>
        </label>
    </div>

    <!-- CAPTURE BUTTON ROW (Mobile only - below rings) -->
    <div class="capture-button-container hidden" id="captureButtonContainer">
        <div class="capture-row">
            <button class="capture-button" id="captureButton">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="28" height="28">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
            </button>
            <label class="capture-upload-button" id="captureUploadButton" title="Upload from library">
                <input type="file" id="fileInputCapture" accept="image/*" multiple class="sr-only">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="22" height="22">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                </svg>
            </label>
        </div>
    </div>

    <!-- ANALYSIS SCREEN (overlays everything when active) -->
    <div class="analysis-screen" id="analysisScreen">
        <h2 class="analysis-heading">Analyzing condition...</h2>

        <div class="analysis-stage" id="analysisStage">
            <h3 id="stageName">Starting Analysis</h3>
            <p id="stageDescription">Please wait...</p>
        </div>

        <div class="analysis-progress-text" id="progressText">0%</div>
    </div>

    <!-- RESULTS SCREEN (overlays everything when active) -->
    <div class="results-screen" id="resultsScreen">
        <div class="results-header">
            <h2>Thrift Spotted!</h2>
        </div>

        <div class="results-item-card">
            <h3 class="results-item-name" id="itemName">Loading...</h3>

            <div class="results-stats">
                <div class="results-stat">
                    <div class="results-stat-label">Estimated Value</div>
                    <div class="results-stat-value" id="estimatedValue">$0</div>
                </div>
                <div class="results-stat">
                    <div class="results-stat-label">Condition</div>
                    <span class="condition-badge" id="conditionBadge">good</span>
                </div>
            </div>

            <!-- AI Description -->
            <div class="ai-description-section">
                <h4>AI-Generated Description</h4>
                <p class="ai-description-text" id="aiDescription">
                    Loading description...
                </p>
            </div>

            <!-- eBay Comparable Listings -->
            <div class="ebay-listings" id="ebayListingsSection">
                <h4>Comparable eBay Listings</h4>
                <div id="ebayListingsContainer">
                    <!-- Will be populated dynamically -->
                </div>
            </div>

            <button class="btn btn-primary btn-full btn-lg" id="createListingBtn">
                Preview Listing
            </button>
        </div>

        <button class="btn btn-primary btn-full" id="scanAnotherBtn" style="margin-top: 16px;">
            Scan Another Item
        </button>
    </div>

    <!-- ========== MAP MODE CONTAINER (hidden by default) ========== -->
    <div class="map-mode-container" id="mapModeContainer">
        <!-- Filter Bar (Floating) -->
        <div class="filter-bar-container">
            <div class="filter-bar" id="filterBar">
                <button class="filter-chip active" data-category="all">All</button>
                <button class="filter-chip" data-category="electronics">Electronics</button>
                <button class="filter-chip" data-category="clothing">Clothing</button>
                <button class="filter-chip" data-category="furniture">Furniture</button>
                <button class="filter-chip" data-category="home & garden">Home</button>
                <button class="filter-chip" data-category="collectibles">Collectibles</button>
                <button class="filter-chip" data-category="toys">Toys</button>
                <button class="filter-chip" data-category="sporting goods">Sports</button>
                <button class="filter-chip" data-category="automotive">Auto</button>
                <button class="filter-chip" data-category="books">Books</button>
                <button class="filter-chip" data-category="tools">Tools</button>
                <button class="filter-chip" data-category="jewelry">Jewelry</button>
            </div>
        </div>

        <!-- Map -->
        <div id="map"></div>

        <!-- Pin Info Panel -->
        <div class="pin-panel" id="pinPanel">
            <div class="pin-panel-header">
                <h3>Item Details</h3>
                <button class="pin-panel-close" id="closePinPanel">✕</button>
            </div>
            <div class="pin-panel-content" id="pinPanelContent">
                <!-- Content will be dynamically populated -->
            </div>
        </div>
    </div>

    <!-- Mode Toggle (replaces bottom nav for main modes) -->
    <div class="mode-toggle" id="modeToggle">
        <div class="mode-toggle-slider slide-right"></div>
        <button class="mode-btn active" id="spotBtn" data-mode="spot">
            <span>📷</span>
            <span>Spot</span>
        </button>
        <button class="mode-btn" id="thriftBtn" data-mode="thrift">
            <span>🗺️</span>
            <span>Thrift</span>
        </button>
    </div>

    <!-- JavaScript -->
    <script src="shared/api-client.js"></script>
    <script src="js/app-v6.js"></script>
</body>
</html>
