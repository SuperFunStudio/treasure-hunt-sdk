<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>ThriftSpot - Preview Listing</title>

    <!-- v7 Design System -->
    <link rel="stylesheet" href="css/thriftspot-v7.css">

    <!-- Firebase -->
    <script src="/__/firebase/10.7.1/firebase-app-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-auth-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-firestore-compat.js"></script>
    <script src="/__/firebase/10.7.1/firebase-storage-compat.js"></script>
    <script src="/__/firebase/init.js"></script>

    <style>
        /* ===== PAGE LAYOUT ===== */
        .page-container {
            min-height: 100vh;
            padding-top: 60px;
            background: var(--bg-primary);
        }

        .page-content {
            max-width: 600px;
            margin: 0 auto;
            padding: var(--space-4) var(--space-4) 120px;
        }

        /* ===== PAGE HEADER ===== */
        .preview-header {
            text-align: center;
            margin-bottom: var(--space-5);
        }

        .preview-header h1 {
            font-size: var(--font-xl);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }

        .preview-header p {
            color: var(--text-tertiary);
            font-size: var(--font-sm);
        }

        /* ===== IMAGE PREVIEW ===== */
        .image-preview-section {
            margin-bottom: var(--space-5);
        }

        .image-grid {
            display: flex;
            gap: var(--space-2);
            overflow-x: auto;
            padding-bottom: var(--space-2);
        }

        .preview-image {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-primary);
            flex-shrink: 0;
        }

        /* ===== FORM SECTIONS ===== */
        .form-section {
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: var(--space-4);
            border: 1px solid var(--border-primary);
            margin-bottom: var(--space-4);
        }

        .section-title {
            font-size: var(--font-sm);
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: var(--space-3);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .form-group {
            margin-bottom: var(--space-3);
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-1);
            font-size: var(--font-xs);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-sm);
            font-size: var(--font-sm);
            font-family: inherit;
            color: var(--text-primary);
            background: var(--bg-card);
            transition: all var(--transition-fast);
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px var(--accent-primary-glow);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--text-tertiary);
        }

        /* ===== USE LOCATION BUTTON ===== */
        .use-location-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-2);
            margin-top: var(--space-2);
            padding: var(--space-2) var(--space-3);
            background: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            border-radius: var(--radius-full);
            font-size: var(--font-xs);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
        }

        .use-location-btn:hover {
            background: rgba(99, 102, 241, 0.15);
        }

        .use-location-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .use-location-btn svg {
            width: 14px;
            height: 14px;
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
        }

        /* ===== TOGGLE SWITCHES ===== */
        .toggle-group {
            display: flex;
            gap: var(--space-2);
        }

        .toggle-option {
            flex: 1;
            position: relative;
        }

        .toggle-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-2) var(--space-3);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-fast);
            background: var(--bg-card);
            gap: var(--space-2);
            font-weight: 600;
            font-size: var(--font-sm);
            color: var(--text-secondary);
        }

        .toggle-input:checked + .toggle-label {
            border-color: var(--accent-primary);
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-primary);
        }

        .toggle-label:hover {
            border-color: var(--accent-primary);
        }

        /* ===== AI BADGE ===== */
        .ai-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-1) var(--space-2);
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4f46e5 100%);
            color: var(--text-primary);
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 600;
        }

        /* ===== ACTION BUTTONS ===== */
        .action-buttons {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-primary);
            padding: var(--space-3) var(--space-4);
            z-index: 100;
        }

        .action-buttons-inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            gap: var(--space-3);
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            padding: var(--space-2) var(--space-4);
            border-radius: var(--radius-full);
            font-size: var(--font-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-fast);
            font-family: inherit;
            border: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-tertiary);
            border: 1px solid var(--border-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-primary {
            background: var(--accent-primary);
            color: var(--text-primary);
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== SUCCESS MODAL ===== */
        .success-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: var(--space-4);
            backdrop-filter: blur(8px);
        }

        .success-modal {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            width: 100%;
            position: relative;
            animation: modalSlideIn 0.3s ease;
            border: 1px solid var(--border-primary);
        }

        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-3) var(--space-4);
            border-bottom: 1px solid var(--border-primary);
        }

        .success-modal-close {
            background: var(--bg-card);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            transition: all var(--transition-fast);
        }

        .success-modal-close:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .success-modal-edit {
            background: transparent;
            border: none;
            font-size: var(--font-xs);
            font-weight: 600;
            color: var(--accent-primary);
            cursor: pointer;
            text-decoration: underline;
        }

        .success-modal-content {
            padding: var(--space-4);
            text-align: center;
        }

        .success-icon {
            font-size: var(--font-4xl);
            margin-bottom: var(--space-2);
        }

        .success-title {
            font-size: var(--font-lg);
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 var(--space-1) 0;
        }

        .success-subtitle {
            font-size: var(--font-sm);
            color: var(--text-tertiary);
            margin: 0 0 var(--space-4) 0;
        }

        .success-card {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: var(--space-4);
            border: 1px solid var(--border-primary);
            text-align: left;
        }

        .success-card-image {
            width: 100%;
            height: 160px;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .success-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .success-card-content {
            padding: var(--space-3);
        }

        .success-item-title {
            font-size: var(--font-base);
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 var(--space-2) 0;
            line-height: 1.3;
        }

        .success-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-2);
            padding-bottom: var(--space-2);
            border-bottom: 1px solid var(--border-primary);
        }

        .success-price {
            font-size: var(--font-xl);
            font-weight: 700;
            color: var(--accent-success);
        }

        .success-condition {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .condition-label {
            font-size: var(--font-xs);
            color: var(--text-tertiary);
        }

        .condition-badge {
            background: var(--accent-success);
            color: var(--bg-primary);
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .success-platforms {
            display: flex;
            gap: var(--space-2);
            margin-bottom: var(--space-2);
            flex-wrap: wrap;
        }

        .platform-badge {
            display: inline-flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-1) var(--space-2);
            background: var(--accent-primary);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: 600;
        }

        .platform-badge.ebay {
            background: #e53238;
        }

        .platform-badge.local {
            background: var(--accent-success);
        }

        .success-description {
            font-size: var(--font-xs);
            color: var(--text-tertiary);
            line-height: 1.5;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .success-actions {
            display: flex;
            gap: var(--space-2);
        }

        .success-actions .btn {
            flex: 1;
        }

        /* ===== HEADER AUTH ===== */
        .user-menu-container {
            position: relative;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-full);
            background: var(--accent-primary);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: var(--font-sm);
            cursor: pointer;
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: var(--space-2);
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            min-width: 150px;
            display: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .user-menu-container:hover .user-dropdown {
            display: block;
        }

        .dropdown-item {
            display: block;
            padding: var(--space-2) var(--space-3);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--font-sm);
            transition: all var(--transition-fast);
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .dropdown-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .page-content {
                padding: var(--space-3) var(--space-3) 110px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: var(--space-3);
            }

            .action-buttons {
                padding: var(--space-2) var(--space-3);
            }

            .preview-image {
                width: 64px;
                height: 64px;
            }

            .success-modal {
                max-height: 95vh;
                border-radius: var(--radius-md);
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="app-header">
        <a href="index.html" class="header-logo">
            <span style="font-size: var(--font-lg); font-weight: 700; color: var(--text-primary); text-decoration: none;">ThriftSpot</span>
        </a>
        <div id="authSection"></div>
    </header>

    <!-- Main Content -->
    <div class="page-container">
        <div class="page-content">
            <!-- Header -->
            <div class="preview-header">
                <h1>Preview Listing</h1>
                <p>Review details before publishing</p>
            </div>

            <!-- Image Preview -->
            <div class="image-preview-section">
                <div class="image-grid" id="imageGrid">
                    <!-- Images will be populated here -->
                </div>
            </div>

            <!-- Item Details -->
            <div class="form-section">
                <h2 class="section-title">
                    Listing Details
                    <span class="ai-badge">🤖 AI</span>
                </h2>

                <div class="form-group">
                    <label class="form-label" for="itemTitle">Title</label>
                    <input type="text" id="itemTitle" class="form-input" placeholder="Item title">
                </div>

                <div class="form-group">
                    <label class="form-label" for="itemDescription">Description</label>
                    <textarea id="itemDescription" class="form-textarea" placeholder="Detailed description"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="category">Category</label>
                        <input type="text" id="category" class="form-input" placeholder="Category">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="brand">Brand</label>
                        <input type="text" id="brand" class="form-input" placeholder="Brand">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="condition">Condition</label>
                        <select id="condition" class="form-select">
                            <option value="excellent">Excellent</option>
                            <option value="good" selected>Good</option>
                            <option value="fair">Fair</option>
                            <option value="poor">Poor</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="color">Color</label>
                        <input type="text" id="color" class="form-input" placeholder="Color">
                    </div>
                </div>
            </div>

            <!-- Pricing -->
            <div class="form-section">
                <h2 class="section-title">Pricing</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="price">
                            <span id="priceLabel">Sale Price</span>
                        </label>
                        <input type="number" id="price" class="form-input" placeholder="0.00" min="0" step="0.01">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="estimatedValue">AI Estimate</label>
                        <input type="text" id="estimatedValue" class="form-input" disabled style="opacity: 0.7;">
                    </div>
                </div>

                <!-- Rental-specific fields (hidden by default) -->
                <div id="rentalFields" style="display: none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="rentalPeriod">Rental Period</label>
                            <select id="rentalPeriod" class="form-select">
                                <option value="hourly">Hourly</option>
                                <option value="daily" selected>Daily</option>
                                <option value="weekly">Weekly</option>
                                <option value="monthly">Monthly</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="securityDeposit">Deposit</label>
                            <input type="number" id="securityDeposit" class="form-input" placeholder="0.00" min="0" step="0.01">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Location (for local listings) -->
            <div class="form-section" id="locationSection">
                <h2 class="section-title">📍 Location</h2>

                <div class="form-group">
                    <label class="form-label" for="location">Where did you find this?</label>
                    <input type="text" id="location" class="form-input" placeholder="Address or location">
                    <button type="button" class="use-location-btn" id="useLocationBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        Use my location
                    </button>
                </div>

                <div class="form-group">
                    <label class="form-label" for="locationNotes">Notes (optional)</label>
                    <input type="text" id="locationNotes" class="form-input" placeholder="e.g., Behind building">
                </div>
            </div>

            <!-- Listing Type - Hidden since only "For Sale" is currently supported -->
            <input type="hidden" id="listingTypeSale" name="listingType" value="sale" checked>

            <!-- Listing Platforms -->
            <div class="form-section">
                <h2 class="section-title">Publish To</h2>
                <div class="toggle-group">
                    <div class="toggle-option">
                        <input type="checkbox" id="listLocal" class="toggle-input" checked>
                        <label for="listLocal" class="toggle-label">
                            <span>📍</span>
                            <span>Map</span>
                        </label>
                    </div>
                    <div class="toggle-option">
                        <input type="checkbox" id="listEbay" class="toggle-input">
                        <label for="listEbay" class="toggle-label">
                            <span>🛒</span>
                            <span>eBay</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fixed Action Buttons -->
    <div class="action-buttons">
        <div class="action-buttons-inner">
            <button class="btn btn-secondary" onclick="window.history.back()">
                ← Back
            </button>
            <button class="btn btn-primary" id="createListingBtn">
                Create Listing
            </button>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="success-modal-overlay" id="successModal" style="display: none;">
        <div class="success-modal">
            <div class="success-modal-header">
                <button class="success-modal-edit" id="editListingBtn">Edit</button>
                <button class="success-modal-close" onclick="document.getElementById('successModal').style.display='none'">✕</button>
            </div>

            <div class="success-modal-content">
                <div class="success-icon">🎉</div>
                <h2 class="success-title">Listed!</h2>
                <p class="success-subtitle">Your item is now live</p>

                <div class="success-card">
                    <div class="success-card-image" id="successCardImage">
                        <!-- Image will be populated -->
                    </div>

                    <div class="success-card-content">
                        <h3 class="success-item-title" id="successItemTitle">Item Title</h3>

                        <div class="success-meta">
                            <div class="success-price" id="successPrice">$0</div>
                            <div class="success-condition">
                                <span class="condition-label">Condition:</span>
                                <span class="condition-badge" id="successConditionBadge">Good</span>
                            </div>
                        </div>

                        <div class="success-platforms" id="successPlatforms">
                            <!-- Platform badges will be populated -->
                        </div>

                        <p class="success-description" id="successDescription">
                            Description will appear here...
                        </p>
                    </div>
                </div>

                <div class="success-actions">
                    <button class="btn btn-secondary" onclick="document.getElementById('successModal').style.display='none'">
                        Close
                    </button>
                    <button class="btn btn-primary" id="viewOnMapBtn">
                        View on Map
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="shared/api-client.js"></script>
    <script src="js/token-system.js"></script>
    <script>
        class ListingPreviewApp {
            constructor() {
                this.currentUser = null;
                this.listingData = null;
                this.photoDataUrls = [];
            }

            async init() {
                console.log('🚀 Listing Preview v7 initializing...');

                // Initialize Firebase Auth
                await this.initAuth();

                // Load listing data from localStorage
                this.loadListingData();

                // Setup event listeners
                this.setupEventListeners();

                console.log('✅ Listing Preview v7 ready!');
            }

            async initAuth() {
                return new Promise((resolve) => {
                    firebase.auth().onAuthStateChanged((user) => {
                        this.currentUser = user;
                        window.currentUser = user;
                        this.updateAuthUI();

                        if (!user) {
                            window.location.href = 'signin.html';
                        }

                        resolve();
                    });
                });
            }

            updateAuthUI() {
                const authSection = document.getElementById('authSection');
                if (this.currentUser) {
                    const displayName = this.currentUser.displayName || this.currentUser.email;
                    const initials = this.getUserInitials(displayName);

                    authSection.innerHTML = `
                        <div class="user-menu-container">
                            <div class="user-avatar">${initials}</div>
                            <div class="user-dropdown">
                                <a href="profile.html" class="dropdown-item">Profile</a>
                                <a href="dashboard.html" class="dropdown-item">Dashboard</a>
                                <button class="dropdown-item" onclick="firebase.auth().signOut()">Sign Out</button>
                            </div>
                        </div>
                    `;
                } else {
                    authSection.innerHTML = `
                        <a href="signin.html" class="btn btn-primary">Sign In</a>
                    `;
                }
            }

            getUserInitials(name) {
                if (!name) return 'U';
                if (name.includes('@')) {
                    return name.substring(0, 2).toUpperCase();
                }
                const parts = name.trim().split(' ');
                if (parts.length >= 2) {
                    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
                }
                return name.substring(0, 2).toUpperCase();
            }

            loadListingData() {
                const pendingAnalysis = sessionStorage.getItem('pendingAnalysis') || localStorage.getItem('pendingAnalysis');

                if (pendingAnalysis) {
                    this.listingData = JSON.parse(pendingAnalysis);

                    if (this.listingData.imageUrls && this.listingData.imageUrls.length > 0) {
                        this.photoDataUrls = this.listingData.imageUrls;
                    }
                }

                const pendingImages = sessionStorage.getItem('pendingImages') || localStorage.getItem('pendingImages');
                if (pendingImages && this.photoDataUrls.length === 0) {
                    this.photoDataUrls = JSON.parse(pendingImages);
                }

                this.populateForm();
            }

            populateForm() {
                const imageGrid = document.getElementById('imageGrid');
                if (this.photoDataUrls.length > 0) {
                    imageGrid.innerHTML = this.photoDataUrls.map(url =>
                        `<img src="${url}" alt="Item photo" class="preview-image">`
                    ).join('');
                }

                const prepopulated = this.listingData?.prepopulatedData || {};

                // Build a clean title without unknown attributes
                const title = this.buildCleanTitle(prepopulated);
                document.getElementById('itemTitle').value = title;
                document.getElementById('itemDescription').value = prepopulated.description || '';
                document.getElementById('category').value = this.cleanAttribute(prepopulated.category) || '';
                document.getElementById('brand').value = this.cleanAttribute(prepopulated.brand) || '';
                document.getElementById('price').value = prepopulated.estimatedPrice || '';
                document.getElementById('estimatedValue').value = `$${prepopulated.estimatedPrice || 0}`;
                document.getElementById('condition').value = prepopulated.condition?.rating || 'good';
            }

            // Check if an attribute is "unknown" or similar
            isUnknownValue(value) {
                if (!value) return true;
                const lowerVal = value.toLowerCase().trim();
                return ['unknown', 'unbranded', 'generic', 'n/a', 'na', 'none', 'untitled', ''].includes(lowerVal);
            }

            // Clean an attribute - return empty string if unknown
            cleanAttribute(value) {
                return this.isUnknownValue(value) ? '' : value;
            }

            // Build a clean title only including known attributes
            buildCleanTitle(data) {
                const parts = [];

                // Add brand if known
                if (!this.isUnknownValue(data.brand)) {
                    parts.push(data.brand);
                }

                // Add category/type if known
                if (!this.isUnknownValue(data.category)) {
                    // Don't duplicate if brand already contains category
                    if (!parts.some(p => data.category.toLowerCase().includes(p.toLowerCase()))) {
                        parts.push(data.category);
                    }
                }

                // Use analysis category as fallback
                if (parts.length === 0 && this.listingData?.analysis?.category) {
                    const analysisCategory = this.listingData.analysis.category;
                    if (!this.isUnknownValue(analysisCategory)) {
                        return analysisCategory;
                    }
                }

                return parts.length > 0 ? parts.join(' ') : 'Item for Sale';
            }

            setupEventListeners() {
                document.getElementById('listLocal').addEventListener('change', (e) => {
                    const locationSection = document.getElementById('locationSection');
                    locationSection.style.display = e.target.checked ? 'block' : 'none';
                });

                document.querySelectorAll('input[name="listingType"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        const rentalFields = document.getElementById('rentalFields');
                        const priceLabel = document.getElementById('priceLabel');

                        if (e.target.value === 'rent') {
                            rentalFields.style.display = 'block';
                            priceLabel.textContent = 'Rental Price';
                        } else {
                            rentalFields.style.display = 'none';
                            priceLabel.textContent = 'Sale Price';
                        }
                    });
                });

                document.getElementById('createListingBtn').addEventListener('click', () => {
                    this.createListing();
                });

                // Use my location button
                document.getElementById('useLocationBtn')?.addEventListener('click', () => {
                    this.useMyLocation();
                });
            }

            async useMyLocation() {
                const btn = document.getElementById('useLocationBtn');
                const locationInput = document.getElementById('location');

                if (!navigator.geolocation) {
                    alert('Geolocation is not supported by your browser');
                    return;
                }

                try {
                    btn.disabled = true;
                    btn.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="animate-spin">
                            <circle cx="12" cy="12" r="10"></circle>
                        </svg>
                        Getting location...
                    `;

                    const position = await this.getCurrentPosition();
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Store lat/lng for later use
                    this.userLat = lat;
                    this.userLng = lng;

                    // Reverse geocode to get address
                    const address = await this.reverseGeocode(lat, lng);

                    if (address) {
                        locationInput.value = address;
                    } else {
                        locationInput.value = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
                    }

                    btn.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        Location set
                    `;
                    btn.style.color = 'var(--accent-success)';
                    btn.style.borderColor = 'var(--accent-success)';

                } catch (error) {
                    console.error('Error getting location:', error);
                    alert('Could not get your location. Please enter it manually.');

                    btn.innerHTML = `
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        Use my location
                    `;
                } finally {
                    btn.disabled = false;
                }
            }

            async createListing() {
                try {
                    const button = document.getElementById('createListingBtn');
                    button.disabled = true;
                    button.textContent = 'Creating...';

                    const listingType = document.getElementById('listingTypeSale')?.value || 'sale';
                    const listingData = {
                        title: document.getElementById('itemTitle').value,
                        description: document.getElementById('itemDescription').value,
                        category: document.getElementById('category').value,
                        brand: document.getElementById('brand').value,
                        condition: document.getElementById('condition').value,
                        color: document.getElementById('color').value,
                        price: parseFloat(document.getElementById('price').value),
                        listingType: listingType,
                        ...(listingType === 'rent' && {
                            rentalPeriod: document.getElementById('rentalPeriod').value,
                            securityDeposit: parseFloat(document.getElementById('securityDeposit').value) || 0
                        }),
                        listLocal: document.getElementById('listLocal').checked,
                        listEbay: document.getElementById('listEbay').checked,
                        location: document.getElementById('location').value,
                        locationNotes: document.getElementById('locationNotes').value,
                        userId: this.currentUser.uid,
                        userEmail: this.currentUser.email,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        status: 'active',
                        analysisData: this.listingData
                    };

                    console.log('Creating listing:', listingData);

                    const imageUrls = await this.uploadImages();
                    listingData.images = imageUrls;

                    let createdPinId = null;

                    if (listingData.listLocal) {
                        const pinId = await this.createMapPin(listingData);
                        createdPinId = pinId;
                        console.log('✅ Map pin created:', pinId);

                        if (window.tokenSystem) {
                            const tokenReward = await window.tokenSystem.awardTokens('pin_created', null, { relatedId: pinId });
                            if (tokenReward.success) {
                                console.log(`✅ Earned ${tokenReward.amount} tokens for pinning item.`);
                            }
                        }
                    }

                    if (listingData.listEbay) {
                        let ebayAccountInfo;
                        try {
                            ebayAccountInfo = await window.apiClient.getEbayAccountInfo();
                            console.log('✅ eBay account connected:', ebayAccountInfo.accountInfo);
                        } catch (error) {
                            console.error('❌ eBay not connected:', error);
                            throw new Error('eBay account not connected. Please go to Profile Settings to connect your eBay account first.');
                        }

                        let scanId = this.listingData?.scanId || this.listingData?.id || this.listingData?._id;
                        if (!scanId) {
                            scanId = `temp_${this.currentUser.uid}_${Date.now()}`;
                        }

                        const ebayListingData = {
                            scanId: scanId,
                            title: listingData.title,
                            description: listingData.description,
                            category: listingData.category,
                            brand: listingData.brand || 'Unbranded',
                            condition: listingData.condition,
                            pricing: {
                                startPrice: listingData.price,
                                buyItNowPrice: listingData.price,
                                format: 'FixedPrice'
                            },
                            images: listingData.images,
                            location: listingData.location,
                            duration: 'GTC',
                            quantity: 1
                        };

                        try {
                            const ebayResult = await window.apiClient.createEbayListing(ebayListingData);
                            console.log('✅ eBay listing created:', ebayResult);
                            listingData.ebayItemId = ebayResult.itemId;
                            listingData.ebayListingUrl = ebayResult.url;

                            if (window.tokenSystem) {
                                try {
                                    const ebayTokenReward = await window.tokenSystem.awardTokens('ebay_listing_created', null, {
                                        relatedId: ebayResult.itemId,
                                        listingUrl: ebayResult.url
                                    });
                                    if (ebayTokenReward.success) {
                                        console.log(`✅ Earned ${ebayTokenReward.amount} tokens for eBay listing.`);
                                    }
                                } catch (tokenError) {
                                    console.warn('Could not award tokens:', tokenError);
                                }
                            }
                        } catch (ebayError) {
                            console.error('❌ eBay listing creation failed:', ebayError);
                            throw new Error(`Failed to create eBay listing: ${ebayError.message}`);
                        }
                    }

                    sessionStorage.removeItem('pendingAnalysis');
                    sessionStorage.removeItem('pendingImages');
                    localStorage.removeItem('pendingAnalysis');
                    localStorage.removeItem('pendingImages');

                    this.showSuccessModal(listingData, createdPinId);

                    button.disabled = false;
                    button.textContent = 'Create Listing';

                } catch (error) {
                    console.error('Error creating listing:', error);
                    alert('Failed to create listing: ' + error.message);

                    const button = document.getElementById('createListingBtn');
                    button.disabled = false;
                    button.textContent = 'Create Listing';
                }
            }

            async uploadImages() {
                if (this.photoDataUrls.length > 0 && this.photoDataUrls[0].startsWith('https://')) {
                    console.log('✅ Images already uploaded to Firebase Storage');
                    return this.photoDataUrls;
                }

                const urls = [];
                const storageRef = firebase.storage().ref();

                for (let i = 0; i < this.photoDataUrls.length; i++) {
                    const dataUrl = this.photoDataUrls[i];
                    const blob = await this.dataUrlToBlob(dataUrl);
                    const filename = `scans/${this.currentUser.uid}/${Date.now()}_${i}.jpg`;
                    const imageRef = storageRef.child(filename);

                    console.log(`📤 Uploading image ${i + 1}/${this.photoDataUrls.length}...`);
                    await imageRef.put(blob);
                    const url = await imageRef.getDownloadURL();
                    urls.push(url);
                }

                return urls;
            }

            async dataUrlToBlob(dataUrl) {
                const response = await fetch(dataUrl);
                return await response.blob();
            }

            async createMapPin(listingData) {
                const db = firebase.firestore();

                let lat = null;
                let lng = null;
                let geohash = null;
                let locationAddress = listingData.location;

                // Use stored location from "Use my location" button if available
                if (this.userLat && this.userLng) {
                    lat = this.userLat;
                    lng = this.userLng;
                    geohash = this.encodeGeohash(lat, lng, 9);
                    console.log('📍 Using stored user location:', { lat, lng, geohash });
                } else {
                    // Fall back to getting current position
                    try {
                        const position = await this.getCurrentPosition();
                        lat = position.coords.latitude;
                        lng = position.coords.longitude;
                        geohash = this.encodeGeohash(lat, lng, 9);
                        console.log('📍 Got user location:', { lat, lng, geohash });

                        // Reverse geocode to get address if not provided
                        if (!locationAddress && lat && lng) {
                            locationAddress = await this.reverseGeocode(lat, lng);
                            console.log('📍 Reverse geocoded address:', locationAddress);
                        }
                    } catch (error) {
                        console.warn('Could not get location:', error);
                    }
                }

                const pinData = {
                    title: listingData.title,
                    description: listingData.description,
                    category: listingData.category,
                    brand: listingData.brand,
                    condition: listingData.condition,
                    price: listingData.price,
                    listingType: listingData.listingType,
                    ...(listingData.rentalPeriod && { rentalPeriod: listingData.rentalPeriod }),
                    ...(listingData.securityDeposit !== undefined && { securityDeposit: listingData.securityDeposit }),
                    images: listingData.images,
                    location: locationAddress,
                    locationNotes: listingData.locationNotes,
                    userId: this.currentUser.uid,
                    userEmail: this.currentUser.email,
                    status: 'active',
                    claimedBy: null,
                    reservedBy: null,
                    reservedUntil: null,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lat: lat,
                    lng: lng,
                    geohash: geohash
                };

                const docRef = await db.collection('pins').add(pinData);
                return docRef.id;
            }

            getCurrentPosition() {
                return new Promise((resolve, reject) => {
                    if (!navigator.geolocation) {
                        reject(new Error('Geolocation not supported'));
                        return;
                    }

                    navigator.geolocation.getCurrentPosition(resolve, reject, {
                        enableHighAccuracy: true,
                        timeout: 5000,
                        maximumAge: 0
                    });
                });
            }

            encodeGeohash(latitude, longitude, precision = 9) {
                const BASE32 = '0123456789bcdefghjkmnpqrstuvwxyz';
                let isEven = true;
                let lat = [-90.0, 90.0];
                let lon = [-180.0, 180.0];
                let geohash = '';
                let bit = 0;
                let ch = 0;

                while (geohash.length < precision) {
                    if (isEven) {
                        const mid = (lon[0] + lon[1]) / 2;
                        if (longitude > mid) {
                            ch |= (1 << (4 - bit));
                            lon[0] = mid;
                        } else {
                            lon[1] = mid;
                        }
                    } else {
                        const mid = (lat[0] + lat[1]) / 2;
                        if (latitude > mid) {
                            ch |= (1 << (4 - bit));
                            lat[0] = mid;
                        } else {
                            lat[1] = mid;
                        }
                    }

                    isEven = !isEven;

                    if (bit < 4) {
                        bit++;
                    } else {
                        geohash += BASE32[ch];
                        bit = 0;
                        ch = 0;
                    }
                }

                return geohash;
            }

            async reverseGeocode(lat, lng) {
                try {
                    // Use Nominatim (OpenStreetMap) for reverse geocoding
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`, {
                        headers: {
                            'Accept': 'application/json',
                            'User-Agent': 'ThriftSpot/1.0'
                        }
                    });

                    if (!response.ok) {
                        console.warn('Reverse geocode failed:', response.status);
                        return null;
                    }

                    const data = await response.json();

                    if (data && data.address) {
                        const addr = data.address;
                        const parts = [];

                        if (addr.house_number && addr.road) {
                            parts.push(`${addr.house_number} ${addr.road}`);
                        } else if (addr.road) {
                            parts.push(addr.road);
                        }

                        if (addr.city || addr.town || addr.village || addr.suburb) {
                            parts.push(addr.city || addr.town || addr.village || addr.suburb);
                        }

                        return parts.length > 0 ? parts.join(', ') : null;
                    }

                    return null;
                } catch (error) {
                    console.warn('Reverse geocode error:', error);
                    return null;
                }
            }

            showSuccessModal(listingData, pinId) {
                document.getElementById('successItemTitle').textContent = listingData.title;
                document.getElementById('successPrice').textContent = `$${listingData.price}`;
                document.getElementById('successConditionBadge').textContent = listingData.condition;
                document.getElementById('successDescription').textContent = listingData.description;

                const imageContainer = document.getElementById('successCardImage');
                if (this.photoDataUrls.length > 0) {
                    imageContainer.innerHTML = `<img src="${this.photoDataUrls[0]}" alt="${listingData.title}">`;
                }

                const platformsContainer = document.getElementById('successPlatforms');
                platformsContainer.innerHTML = '';

                if (listingData.listLocal) {
                    platformsContainer.innerHTML += `
                        <span class="platform-badge local">📍 Map</span>
                    `;
                }

                if (listingData.listEbay) {
                    const ebayBadgeHtml = listingData.ebayListingUrl ?
                        `<a href="${listingData.ebayListingUrl}" target="_blank" class="platform-badge ebay" style="text-decoration: none;">🛒 eBay</a>` :
                        `<span class="platform-badge ebay">🛒 eBay</span>`;
                    platformsContainer.innerHTML += ebayBadgeHtml;
                }

                document.getElementById('viewOnMapBtn').onclick = () => {
                    if (pinId) {
                        window.location.href = `pin-map.html?pin=${pinId}`;
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                };

                document.getElementById('editListingBtn').onclick = () => {
                    document.getElementById('successModal').style.display = 'none';
                };

                document.getElementById('successModal').style.display = 'flex';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            window.app = new ListingPreviewApp();
            window.app.init();
        });
    </script>
